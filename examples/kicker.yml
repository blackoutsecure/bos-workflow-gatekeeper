# Example "kicker" workflow: a single workflow_dispatch front door that
# authorizes the actor, narrows which operations are currently enabled via a
# config file, and routes to the right backend workflow. Copy into
# .github/workflows/kicker.yml and adjust the operations/backends for your
# repo. See the "Recommended kicker workflow template" section of the
# bos-workflow-gatekeeper README for the full write-up.
#
# Routing uses `workflow_call` (uses: ./.github/workflows/<file>.yml), not a
# second dispatch — a workflow_call target can't be triggered directly by
# anyone else, so the attack surface stays at this one front door. Reach for
# handoff_only/dispatch_handoff instead only when the next workflow's name
# truly isn't known until runtime (see "Dynamic chaining with no human
# actor" in the README).
name: Kicker

run-name: Kicker / ${{ inputs.operation }} / by @${{ github.triggering_actor }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Which pipeline to run.
        required: true
        type: choice
        options: [deploy, maintenance]
        default: deploy

permissions:
  contents: read

concurrency:
  group: kicker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize dispatch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Short-lived installation token, preferred over a long-lived PAT.
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ vars.GATEKEEPER_APP_ID }}
          private-key: ${{ secrets.GATEKEEPER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: blackoutsecure/bos-workflow-gatekeeper@v1
        with:
          actor: ${{ github.triggering_actor }}
          organization: ${{ github.repository_owner }}
          required_teams: release-managers
          token: ${{ steps.token.outputs.token }}
          # Narrows `operation` against a config file without editing this
          # workflow — e.g. temporarily disable `deploy` during an incident
          # by removing it from .github/kicker-policy.json, no redeploy of
          # this file needed. Missing file/key fails OPEN (unrestricted);
          # see "Config-driven allowlists" in the README.
          allowlist_config_path: .github/kicker-policy.json
          allowlist_config_key: kicker.enabled_operations
          allowlist_value: ${{ inputs.operation }}

  deploy:
    name: Deploy
    needs: authorize
    if: inputs.operation == 'deploy'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  maintenance:
    name: Maintenance
    needs: authorize
    if: inputs.operation == 'maintenance'
    permissions:
      contents: read
    uses: ./.github/workflows/maintenance.yml
    secrets: inherit
