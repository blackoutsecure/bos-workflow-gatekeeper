[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bos-workflow-gatekeeper"
version = "1.0.0"
description = "Fail-closed authorization for GitHub Actions — resolve organization role, team membership, repository permission, and enterprise ownership, then deny unauthorized runs."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Blackout Secure"}]
keywords = [
  "github",
  "actions",
  "security",
  "authorization",
  "access-control",
  "workflow-dispatch",
  "rbac",
  "teams",
  "enterprise",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "PyYAML>=6.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/blackoutsecure/bos-workflow-gatekeeper"
Issues = "https://github.com/blackoutsecure/bos-workflow-gatekeeper/issues"
Source = "https://github.com/blackoutsecure/bos-workflow-gatekeeper"

[tool.pytest.ini_options]
# Lets contributors run the suite without `pip install -e .`.
pythonpath = ["src"]
testpaths = ["test"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "E501",  # line length is enforced by `line-length`; long URLs in docs are fine
  "S101",  # `assert` is normal in pytest
]

[tool.ruff.lint.per-file-ignores]
"test/**" = ["S", "B"]

[tool.ruff.lint.isort]
known-first-party = ["_version", "gatekeeper", "policy", "runtime", "signals"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
  "test",
]
