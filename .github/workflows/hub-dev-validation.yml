# Development-only validation through bos-automation-hub.
# This workflow calls reusable jobs directly and never dispatches a kicker.
name: Hub dev validation

"on":
  workflow_dispatch:

permissions: {}

concurrency:
  group: hub-dev-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Hub security validation
    if: github.ref_name == 'dev'
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-security.yml@dev
    permissions:
      contents: read
      actions: read
      security-events: write
      pull-requests: read

  action-test:
    name: Hub action-test validation
    if: github.ref_name == 'dev'
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-action-test.yml@dev
    permissions:
      contents: read

  marketplace:
    name: Hub Marketplace validation
    if: github.ref_name == 'dev'
    uses: blackoutsecure/bos-automation-hub/.github/workflows/bos-universal-marketplace.yml@dev
    permissions:
      contents: read
