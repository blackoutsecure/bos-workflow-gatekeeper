# Deploy the static GitHub App setup helper (app-setup/) to GitHub Pages.
#
# One-time manual step required before this takes effect: repository
# Settings -> Pages -> Build and deployment -> Source, select
# "GitHub Actions". See app-setup/README.md for what this page does and why
# it needs no backend.
name: Deploy app-setup to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['app-setup/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: app-setup

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
