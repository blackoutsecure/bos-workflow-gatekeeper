name: Self-test

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dev dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src test

      - name: Check action metadata sync
        run: python3 scripts/check_action_sync.py

      - name: Check README action tables sync
        run: python3 scripts/render_readme_inputs.py --check

      - name: Pytest
        run: pytest test/ -v

  self-check:
    name: Action self-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run gatekeeper on a non-dispatch event
        id: gate
        uses: ./
        with:
          actor: ${{ github.triggering_actor }}
          organization: ${{ github.repository_owner }}
          token: ${{ github.token }}
          restrict_to_events: workflow_dispatch

      - name: Assert pass-through contract
        env:
          ENFORCED: ${{ steps.gate.outputs.enforced }}
          AUTHORIZED: ${{ steps.gate.outputs.authorized }}
        run: |
          set -euo pipefail
          [ "${ENFORCED}" = "false" ] || { echo "::error::expected enforced=false"; exit 1; }
          [ "${AUTHORIZED}" = "true" ] || { echo "::error::expected authorized=true"; exit 1; }
          echo "Pass-through contract confirmed."
