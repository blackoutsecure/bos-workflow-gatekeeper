name: 'Blackout Secure Workflow Gatekeeper'
# MP010: keep <= 125 chars; full feature list lives in README.md.
description: >-
  Fail-closed authorization for GitHub Actions. Deny unauthorized runs by org role, team, repo permission, or enterprise.
author: 'Blackout Secure'

branding:
  color: 'orange'
  icon: 'shield'

inputs:
  actor:
    description: >-
      Login to authorize. Use `github.triggering_actor`, not `github.actor` —
      on a re-run `actor` stays the original dispatcher while
      `triggering_actor` is whoever pressed re-run.
    required: false
    default: ''
  organization:
    description: 'Organization login that owns the repository.'
    required: false
    default: ''
  token:
    description: >-
      Credential for organization, team, and repository lookups. Prefer a
      GitHub App installation token with `members: read` (short-lived). A PAT
      with `read:org` also works. The default GITHUB_TOKEN cannot resolve
      organization role, team membership, or enterprise ownership.
    required: false
    default: ''
  repository:
    description: '`owner/repo` for the repository-permission check. Required only when `required_repo_permission` is set.'
    required: false
    default: ''
  event_name:
    description: 'Event that triggered the run. Compared against `restrict_to_events`.'
    required: false
    default: ''
  restrict_to_events:
    description: >-
      Comma-separated events to enforce on. Other events pass through without
      any API call. Use `*` to gate every event.
    required: false
    default: 'workflow_dispatch'
  required_teams:
    description: 'Comma-separated team slugs whose active members are authorized. Empty disables the check.'
    required: false
    default: ''
  required_repo_permission:
    description: >-
      Minimum repository permission: `read`, `triage`, `write`, `maintain`, or
      `admin`. Empty disables the check.
    required: false
    default: ''
  allow_org_admin:
    description: 'Treat organization owners as authorized.'
    required: false
    default: 'true'
  enterprise_slug:
    description: >-
      Enterprise slug for the owner lookup. Empty disables the check. Requires
      `enterprise_token`; see the README security note before enabling.
    required: false
    default: ''
  enterprise_token:
    description: >-
      PAT with `admin:enterprise` belonging to an enterprise owner. No GitHub
      App installation token can read `enterprise.ownerInfo`. Falls back to
      `token`.
    required: false
    default: ''
  require_enterprise_owner:
    description: 'Only enterprise owners are authorized; every other check is ignored as a grant path.'
    required: false
    default: 'false'
  require_all:
    description: 'Require every enabled check to pass (AND). Default is any (OR).'
    required: false
    default: 'false'
  fail_closed:
    description: >-
      Fail the job when the actor is unauthorized or a signal is inconclusive.
      Set `false` to annotate without enforcing during rollout.
    required: false
    default: 'true'
  summary:
    description: 'Write the decision table to the job summary.'
    required: false
    default: 'true'
  caller_workflow:
    description: >-
      Expected caller workflow file or workflow name. A mismatch emits a
      warning but does not fail unless caller_check_fail is true.
    required: false
    default: ''
  caller_repository:
    description: 'Expected caller repository as `owner/repo`; empty skips the repository check.'
    required: false
    default: ''
  caller_check_fail:
    description: 'Fail when the configured caller identity does not match the running workflow.'
    required: false
    default: 'false'
  suppress_caller_warning:
    description: 'Suppress the notification emitted when the configured caller identity does not match.'
    required: false
    default: 'false'
  handoff_workflow:
    description: >-
      Workflow file or workflow ID to dispatch after authorization. Empty
      disables handoff. A workflow is required when dispatch_handoff is true.
    required: false
    default: ''
  handoff_repository:
    description: 'Repository receiving the workflow dispatch; defaults to the current repository.'
    required: false
    default: ''
  handoff_ref:
    description: 'Git ref for the handoff workflow; defaults to the current ref.'
    required: false
    default: ''
  dispatch_handoff:
    description: 'Dispatch the configured handoff workflow after authorization succeeds.'
    required: false
    default: 'false'
  preflight_spec:
    description: >-
      JSON dependency specification for runner preflight. Supports
      required_commands, min_versions, version_args, required_python_packages,
      and fail_on_missing. Empty skips capability checks.
    required: false
    default: ''
  preflight_gate_level:
    description: 'Label shown in the preflight summary, such as low, standard, or high.'
    required: false
    default: 'standard'
  preflight_only:
    description: 'Run only runner preflight and skip actor authorization. Intended for workflow orchestration.'
    required: false
    default: 'false'

outputs:
  authorized:
    description: '`true` when the actor satisfied the policy.'
    value: ${{ steps.gate.outputs.authorized }}
  reason:
    description: 'Human-readable explanation of the decision.'
    value: ${{ steps.gate.outputs.reason }}
  enforced:
    description: '`false` when the event was outside `restrict_to_events` and no check ran.'
    value: ${{ steps.gate.outputs.enforced }}
  org_role:
    description: 'admin, member, outside, or unknown.'
    value: ${{ steps.gate.outputs.org_role }}
  teams:
    description: 'Comma-separated matched team slugs.'
    value: ${{ steps.gate.outputs.teams }}
  repo_permission:
    description: 'Resolved repository permission, or unknown.'
    value: ${{ steps.gate.outputs.repo_permission }}
  enterprise_owner:
    description: 'true, false, or unknown.'
    value: ${{ steps.gate.outputs.enterprise_owner }}
  caller_valid:
    description: '`true` when the configured caller identity matches; `unknown` when no caller check is configured.'
    value: ${{ steps.gate.outputs.caller_valid }}
  handoff_requested:
    description: '`true` when a handoff workflow was configured.'
    value: ${{ steps.gate.outputs.handoff_requested }}
  handoff_dispatched:
    description: '`true` when the handoff workflow was dispatched successfully.'
    value: ${{ steps.gate.outputs.handoff_dispatched }}
  handoff_workflow:
    description: 'Workflow file or ID selected for the handoff.'
    value: ${{ steps.gate.outputs.handoff_workflow }}
  handoff_repository:
    description: 'Repository selected for the handoff.'
    value: ${{ steps.gate.outputs.handoff_repository }}
  handoff_ref:
    description: 'Git ref selected for the handoff.'
    value: ${{ steps.gate.outputs.handoff_ref }}
  preflight_satisfied:
    description: '`true` when every declared runner requirement was met.'
    value: ${{ steps.preflight.outputs.preflight_satisfied }}
  preflight_missing:
    description: 'Comma-separated list of unmet runner requirements.'
    value: ${{ steps.preflight.outputs.preflight_missing }}

runs:
  using: composite
  steps:
    - name: Verify runner capabilities
      id: preflight
      shell: bash
      env:
        PREFLIGHT_SPEC: ${{ inputs.preflight_spec }}
        PREFLIGHT_GATE_LEVEL: ${{ inputs.preflight_gate_level }}
        PREFLIGHT_ONLY: ${{ inputs.preflight_only }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/src/preflight.py"

    - name: Authorize actor
      id: gate
      if: inputs.preflight_only != 'true'
      shell: bash
      env:
        ACTOR: ${{ inputs.actor }}
        ORGANIZATION: ${{ inputs.organization }}
        TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository || github.repository }}
        EVENT_NAME: ${{ inputs.event_name || github.event_name }}
        RESTRICT_TO_EVENTS: ${{ inputs.restrict_to_events }}
        REQUIRED_TEAMS: ${{ inputs.required_teams }}
        REQUIRED_REPO_PERMISSION: ${{ inputs.required_repo_permission }}
        ALLOW_ORG_ADMIN: ${{ inputs.allow_org_admin }}
        ENTERPRISE_SLUG: ${{ inputs.enterprise_slug }}
        ENTERPRISE_TOKEN: ${{ inputs.enterprise_token }}
        REQUIRE_ENTERPRISE_OWNER: ${{ inputs.require_enterprise_owner }}
        REQUIRE_ALL: ${{ inputs.require_all }}
        FAIL_CLOSED: ${{ inputs.fail_closed }}
        SUMMARY: ${{ inputs.summary }}
        CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
        CALLER_REPOSITORY: ${{ inputs.caller_repository }}
        CALLER_CHECK_FAIL: ${{ inputs.caller_check_fail }}
        SUPPRESS_CALLER_WARNING: ${{ inputs.suppress_caller_warning }}
        HANDOFF_WORKFLOW: ${{ inputs.handoff_workflow }}
        HANDOFF_REPOSITORY: ${{ inputs.handoff_repository || github.repository }}
        HANDOFF_REF: ${{ inputs.handoff_ref || github.ref }}
        DISPATCH_HANDOFF: ${{ inputs.dispatch_handoff }}
        GITHUB_WORKFLOW: ${{ github.workflow }}
        GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_REF: ${{ github.ref }}
        GITHUB_API_URL: ${{ github.api_url }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/src/gatekeeper.py"
